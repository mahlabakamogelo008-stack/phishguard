<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🛡️</div>
            <h1>PhishGuard</h1>
            <p>Phishing Website Detection System</p>
        </header>

        <main>

            <h2>Check a website before you trust it.</h2>

            <p class="description">
                Enter a website URL to check for common phishing warning signs.
            </p>

            <div class="input-section">
                <input 
                    type="text" 
                    id="urlInput"
                    placeholder="https://example.com"
                >

                <button id="scanButton">
                    Scan Website
                </button>
            </div>

            <div id="result" class="result hidden">

                <h2 id="verdict"></h2>

                <p id="riskScore"></p>

                <div id="checks"></div>

            </div>

        </main>

        <footer>
            <p>PhishGuard is an educational early-warning tool.</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>

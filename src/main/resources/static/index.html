<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <header>
    <div class="logo">PhishGuard</div>
</header> 

    <main>
        <section class="intro">
            <h1>Check a website<br>before you trust it.</h1>
            <p>Enter a URL to check for common phishing warning signs.</p>

            <div class="input-row">
                <input 
                    type="text" 
                    id="urlInput"
                    placeholder="https://example.com"
                >
                <button id="scanButton">Scan</button>
            </div>
        </section>

        <section id="result" class="result hidden">
            <h2 id="verdict"></h2>
            <p id="riskScore"></p>
            <div id="checks"></div>
        </section>
    </main>

    <footer>
        Built by Kamogelo Mahlaba · PhishGuard 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
